$kind: http-request
method: POST
url: '{{baseUrl}}/inventory/import'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{inventoryStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId}},
      "quantity": 100,
      "reason": "Nhập lô hàng đầu tiên"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Nhập kho sản phẩm 1 thành công (201)', () => {
        pm.response.to.have.status(201);
        const res = pm.response.json();
        pm.expect(res.currentStock).to.eql(100);
        pm.expect(res.transaction.transactionType).to.eql('IMPORT');
      });
