$kind: http-request
method: POST
url: '{{baseUrl}}/inventory/import'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{inventoryStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": 999999,
      "quantity": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Nhập kho sản phẩm không tồn tại (404)', () => {
        pm.response.to.have.status(404);
      });
