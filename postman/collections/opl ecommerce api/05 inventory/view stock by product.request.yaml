$kind: http-request
method: GET
url: '{{baseUrl}}/inventory/stock/{{productId}}'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin xem tồn kho 1 sản phẩm (200)', () => {
        pm.response.to.have.status(200);
        const res = pm.response.json();
        pm.expect(res.productId).to.eql(Number(pm.collectionVariables.get('productId')));
        pm.expect(res.stock).to.eql(100);
      });
