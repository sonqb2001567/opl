$kind: http-request
method: POST
url: '{{baseUrl}}/inventory/export'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{inventoryStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId}},
      "quantity": 20,
      "reason": "Xuất hàng lỗi trả nhà cung cấp"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Xuất kho thành công (201)', () => {
        pm.response.to.have.status(201);
        // 100 - 20 = 80
        pm.expect(pm.response.json().currentStock).to.eql(80);
      });
