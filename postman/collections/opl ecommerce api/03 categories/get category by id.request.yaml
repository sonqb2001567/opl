$kind: http-request
method: GET
url: '{{baseUrl}}/categories/{{categoryId}}'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Xem chi tiết danh mục (200)', () => {
        pm.response.to.have.status(200);
        const res = pm.response.json();
        pm.expect(res.id).to.eql(Number(pm.collectionVariables.get('categoryId')));
      });
