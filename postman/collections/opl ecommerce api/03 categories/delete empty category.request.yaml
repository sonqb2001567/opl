$kind: http-request
method: DELETE
url: '{{baseUrl}}/categories/{{tempCategoryId}}'
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{productStaffToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Xóa danh mục không có sản phẩm thành công (200)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().message).to.be.a('string');
      });
