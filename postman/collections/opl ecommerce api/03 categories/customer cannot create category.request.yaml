$kind: http-request
method: POST
url: '{{baseUrl}}/categories'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Danh mục của hacker"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Khách hàng không được tạo danh mục (403)', () => {
        pm.response.to.have.status(403);
      });
