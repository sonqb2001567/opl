$kind: http-request
method: POST
url: '{{baseUrl}}/categories'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{productStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "categoryName": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Tên danh mục rỗng phải bị từ chối (400)', () => {
        pm.response.to.have.status(400);
      });
