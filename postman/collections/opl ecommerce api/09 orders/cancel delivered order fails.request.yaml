$kind: http-request
method: POST
url: '{{baseUrl}}/orders/{{orderId}}/cancel'
order: 13000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Đổi ý không muốn mua nữa"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Đơn đã giao thì khách không hủy được (400)', () => {
        pm.response.to.have.status(400);
      });
