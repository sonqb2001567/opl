$kind: http-request
method: GET
url: '{{baseUrl}}/orders/my'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Lịch sử mua hàng của khách (200)', () => {
        pm.response.to.have.status(200);
        const res = pm.response.json();
        pm.expect(res).to.be.an('array');
        const ids = res.map((o) => o.id);
        // Giỏ 2 sản phẩm đã được tách thành 2 đơn riêng
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('orderId')));
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('splitOrderId')));
      });
      pm.test('Mỗi đơn chỉ có 1 dòng chi tiết (quan hệ 1-1)', () => {
        pm.response.json().forEach((o) => {
          pm.expect(o.orderDetail).to.be.an('object');
          pm.expect(o.orderDetails).to.be.undefined;
        });
      });
