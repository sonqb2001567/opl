$kind: http-request
method: GET
url: '{{baseUrl}}/orders/my/{{orderId}}'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Khách theo dõi chi tiết đơn của mình (200)', () => {
        pm.response.to.have.status(200);
        const res = pm.response.json();
        pm.expect(res.id).to.eql(Number(pm.collectionVariables.get('orderId')));
        // Quan hệ 1-1: orderDetail là 1 object, không phải mảng
        pm.expect(res.orderDetail).to.be.an('object');
        pm.expect(res.orderDetail.productId).to.eql(Number(pm.collectionVariables.get('productId')));
        pm.expect(res.orderDetail.quantity).to.eql(2);
      });
