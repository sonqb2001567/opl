$kind: http-request
method: PATCH
url: '{{baseUrl}}/users/{{productStaffId}}/lock'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Khóa tài khoản thành công', () => {
        pm.response.to.have.status(200);
      });
