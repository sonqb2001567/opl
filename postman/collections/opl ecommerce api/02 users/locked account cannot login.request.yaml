$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{productStaffEmail}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Tài khoản bị khóa không đăng nhập được (401)', () => {
        pm.response.to.have.status(401);
      });
