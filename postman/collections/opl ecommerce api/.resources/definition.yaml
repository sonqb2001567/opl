$kind: collection
name: OPL Ecommerce API
description: |-
  Test toàn bộ API của hệ thống ecommerce (NestJS + Prisma).
  Chạy theo thứ tự folder từ trên xuống để test flow E2E:
  đăng ký/xác thực OTP/đăng nhập -> tạo nhân viên -> danh mục -> sản phẩm -> nhập kho
  -> voucher -> giỏ hàng -> đặt hàng -> xử lý đơn -> đánh giá -> báo cáo -> hủy đơn.

  Yêu cầu trước khi chạy:
  1. Server đang chạy tại baseUrl (mặc định http://localhost:3000)
  2. DB đã có tài khoản admin (chạy prisma/seed-admin.sql): admin@test.com / admin123
  3. KHÔNG cấu hình MAIL_HOST / MAIL_USER / MAIL_PASS trong .env.
     Khi chưa có SMTP, API trả mã OTP trong field `devOtp` để test tự lấy được mã.
     Cấu hình SMTP thật thì mã chỉ nằm trong email và các test OTP sẽ fail.

  Lưu ý về quan hệ dữ liệu:
  - Category - Product là N-N: tạo sản phẩm dùng `categoryIds` (mảng ID danh mục).
  - Order - OrderDetail là 1-1: đặt hàng từ giỏ có N sản phẩm sẽ tạo N đơn,
    response trả về mảng `orders`, mỗi đơn có 1 field `orderDetail`.
variables:
  - key: baseUrl
    value: 'http://localhost:3000'
  - key: adminEmail
    value: 'admin@test.com'
  - key: adminPassword
    value: 'admin123'
  - key: userPassword
    value: '123456'
  - key: adminSetupKey
    value: 'khong-dung-key-that'
