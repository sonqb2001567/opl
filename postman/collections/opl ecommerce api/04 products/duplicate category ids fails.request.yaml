$kind: http-request
method: POST
url: '{{baseUrl}}/products'
order: 6500
headers:
  - key: Authorization
    value: 'Bearer {{productStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productName": "Sản phẩm danh mục trùng",
      "skuCode": "SKU-DUP-CAT-1",
      "price": 99000,
      "categoryIds": [{{categoryId}}, {{categoryId}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Danh sách danh mục trùng phải bị từ chối (400)', () => {
        pm.response.to.have.status(400);
      });
