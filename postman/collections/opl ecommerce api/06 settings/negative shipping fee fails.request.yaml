$kind: http-request
method: PUT
url: '{{baseUrl}}/settings/shipping-fee'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shippingFee": -5000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Phí ship âm phải bị từ chối (400)', () => {
        pm.response.to.have.status(400);
      });
