$kind: http-request
method: POST
url: '{{baseUrl}}/cart/items'
order: 11000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId}},
      "quantity": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Chuẩn bị giỏ cho đặt hàng - sản phẩm 1 (201)', () => {
        pm.response.to.have.status(201);
      });
