$kind: http-request
method: POST
url: '{{baseUrl}}/cart/items'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": 999999,
      "quantity": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Thêm sản phẩm không tồn tại (404)', () => {
        pm.response.to.have.status(404);
      });
