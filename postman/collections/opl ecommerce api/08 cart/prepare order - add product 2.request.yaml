$kind: http-request
method: POST
url: '{{baseUrl}}/cart/items'
order: 12000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId2}},
      "quantity": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Chuẩn bị giỏ cho đặt hàng - sản phẩm 2 (201)', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().items.length).to.eql(2);
      });
