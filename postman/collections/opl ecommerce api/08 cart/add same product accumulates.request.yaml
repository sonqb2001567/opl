$kind: http-request
method: POST
url: '{{baseUrl}}/cart/items'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId}},
      "quantity": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Thêm trùng sản phẩm thì cộng dồn số lượng (201)', () => {
        pm.response.to.have.status(201);
        const res = pm.response.json();
        pm.expect(res.items.length).to.eql(2);
        const item = res.items.find((i) => i.product.id === Number(pm.collectionVariables.get('productId')));
        // 2 + 1 = 3
        pm.expect(item.quantity).to.eql(3);
      });
