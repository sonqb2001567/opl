$kind: http-request
method: GET
url: '{{baseUrl}}/reports/orders'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Khách hàng không được xem báo cáo (403)', () => {
        pm.response.to.have.status(403);
      });
