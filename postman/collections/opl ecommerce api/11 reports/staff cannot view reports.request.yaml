$kind: http-request
method: GET
url: '{{baseUrl}}/reports/revenue'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{inventoryStaffToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Nhân viên kho không được xem báo cáo (403)', () => {
        pm.response.to.have.status(403);
      });
