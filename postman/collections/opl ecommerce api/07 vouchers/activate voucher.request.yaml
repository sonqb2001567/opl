$kind: http-request
method: PATCH
url: '{{baseUrl}}/vouchers/{{voucherId}}/activate'
order: 12000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Kích hoạt lại voucher để dùng khi đặt hàng (200)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('ACTIVE');
      });
