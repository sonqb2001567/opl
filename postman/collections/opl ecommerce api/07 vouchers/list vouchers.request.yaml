$kind: http-request
method: GET
url: '{{baseUrl}}/vouchers'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin xem danh sách voucher (200)', () => {
        pm.response.to.have.status(200);
        const res = pm.response.json();
        pm.expect(res).to.be.an('array');
        pm.expect(res.map((v) => v.id)).to.include(Number(pm.collectionVariables.get('voucherId')));
      });
