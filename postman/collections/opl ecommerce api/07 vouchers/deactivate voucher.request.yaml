$kind: http-request
method: PATCH
url: '{{baseUrl}}/vouchers/{{voucherId}}/deactivate'
order: 10000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Ngừng chương trình giảm giá (200)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('INACTIVE');
      });
