$kind: http-request
method: GET
url: '{{baseUrl}}/vouchers/{{voucherId}}'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Xem chi tiết voucher (200)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().code).to.eql(pm.collectionVariables.get('voucherCode'));
      });
