$kind: http-request
method: POST
url: '{{baseUrl}}/vouchers'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "HACK100",
      "discountValue": 100000000,
      "validFrom": "{{voucherValidFrom}}",
      "validTo": "{{voucherValidTo}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Khách hàng không được tạo voucher (403)', () => {
        pm.response.to.have.status(403);
      });
