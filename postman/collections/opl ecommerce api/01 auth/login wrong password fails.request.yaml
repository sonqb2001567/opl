$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "sai-mat-khau"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Sai mật khẩu phải bị từ chối (401)', () => {
        pm.response.to.have.status(401);
      });
