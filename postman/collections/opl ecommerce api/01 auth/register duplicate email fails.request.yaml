$kind: http-request
method: POST
url: '{{baseUrl}}/auth/register'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Khách Trùng Email",
      "email": "{{customerEmail}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Email trùng phải bị từ chối (400)', () => {
        pm.response.to.have.status(400);
      });
