$kind: http-request
method: POST
url: '{{baseUrl}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Khách Hàng Test",
      "email": "{{customerEmail}}",
      "password": "{{userPassword}}",
      "phoneNumber": "0901234567",
      "address": "123 Đường Test, Quận 1, TP.HCM"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Mỗi lần chạy tạo email mới để không bị trùng
      pm.collectionVariables.set('customerEmail', 'customer_' + Date.now() + '@test.com');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Đăng ký thành công (201)', () => {
        pm.response.to.have.status(201);
      });
      pm.test('Response không chứa password, email chưa xác thực', () => {
        const res = pm.response.json();
        pm.expect(res.user.password).to.be.undefined;
        pm.expect(res.user.email).to.eql(pm.collectionVariables.get('customerEmail'));
        pm.expect(res.user.role).to.eql('CUSTOMER');
        // Chưa xác thực OTP nên emailVerifiedAt vẫn null
        pm.expect(res.user.emailVerifiedAt).to.eql(null);
      });
      pm.test('Có mã OTP để xác thực email', () => {
        const res = pm.response.json();
        // devOtp chỉ trả về khi server CHƯA cấu hình SMTP (MAIL_HOST/MAIL_USER/MAIL_PASS).
        // Cấu hình SMTP thật thì mã chỉ nằm trong email, bộ test này sẽ không chạy được.
        pm.expect(res.devOtp, 'cần bỏ cấu hình MAIL_* để chạy bộ test').to.be.a('string');
        pm.collectionVariables.set('customerOtp', res.devOtp);
      });
