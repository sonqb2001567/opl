$kind: http-request
method: POST
url: '{{baseUrl}}/auth/reset-password'
order: 11000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "otp": "{{wrongResetOtp}}",
      "newPassword": "khong-duoc-doi-123"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const realOtp = pm.collectionVariables.get('resetOtp');
      pm.collectionVariables.set('wrongResetOtp', realOtp === '000000' ? '111111' : '000000');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OTP sai thì không đổi được mật khẩu (400)', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().message).to.include('không đúng');
      });
