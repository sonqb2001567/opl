$kind: http-request
method: POST
url: '{{baseUrl}}/auth/forgot-password'
order: 10000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Gửi mã đặt lại mật khẩu thành công (201)', () => {
        pm.response.to.have.status(201);
      });
      pm.test('Có mã OTP đặt lại mật khẩu', () => {
        const res = pm.response.json();
        pm.expect(res.devOtp, 'cần bỏ cấu hình MAIL_* để chạy bộ test').to.be.a('string');
        pm.collectionVariables.set('resetOtp', res.devOtp);
      });
