$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 1100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Chưa xác thực email thì không đăng nhập được (401)', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().message).to.include('chưa được xác thực');
      });
