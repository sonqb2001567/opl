$kind: http-request
method: POST
url: '{{baseUrl}}/auth/reset-password'
order: 12500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "otp": "{{resetOtp}}",
      "newPassword": "mat-khau-khac-123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Mã OTP đã dùng không dùng lại được (400)', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().message).to.include('gửi lại mã');
      });
