$kind: http-request
method: POST
url: '{{baseUrl}}/auth/forgot-password'
order: 10500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "khong-ton-tai-999@test.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Email không tồn tại vẫn trả về thông báo trung lập (201)', () => {
        pm.response.to.have.status(201);
        const res = pm.response.json();
        // Không được tiết lộ email có tài khoản hay không, nên không có devOtp
        pm.expect(res.message).to.include('Nếu email');
        pm.expect(res.devOtp).to.be.undefined;
      });
