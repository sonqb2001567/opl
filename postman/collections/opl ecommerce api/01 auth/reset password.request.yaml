$kind: http-request
method: POST
url: '{{baseUrl}}/auth/reset-password'
order: 12000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "otp": "{{resetOtp}}",
      "newPassword": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Đặt lại đúng mật khẩu cũ để các folder sau vẫn đăng nhập được
      pm.test('Đặt lại mật khẩu thành công (201)', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().message).to.include('thành công');
      });
