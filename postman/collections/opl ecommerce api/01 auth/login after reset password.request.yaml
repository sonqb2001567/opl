$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 13000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Đăng nhập được bằng mật khẩu sau khi đặt lại (201)', () => {
        pm.response.to.have.status(201);
        const res = pm.response.json();
        pm.expect(res.accessToken).to.be.a('string');
        // Làm mới token cho các folder sau
        pm.collectionVariables.set('customerToken', res.accessToken);
      });
