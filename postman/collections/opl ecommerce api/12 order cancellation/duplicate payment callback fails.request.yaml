$kind: http-request
method: POST
url: '{{baseUrl}}/orders/{{orderId2}}/payment-callback'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "success": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Không xử lý thanh toán 2 lần cho 1 đơn (400)', () => {
        pm.response.to.have.status(400);
      });
