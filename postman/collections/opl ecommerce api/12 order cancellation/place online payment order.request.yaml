$kind: http-request
method: POST
url: '{{baseUrl}}/orders'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shippingAddress": "456 Đường Online, Quận 3, TP.HCM",
      "paymentMethod": "BANK_TRANSFER"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Đặt đơn thanh toán chuyển khoản (201)', () => {
        pm.response.to.have.status(201);
        const order = pm.response.json().order;
        pm.expect(order.paymentMethod).to.eql('BANK_TRANSFER');
        pm.expect(order.paymentStatus).to.eql('UNPAID');
        // Không voucher: tổng = giá sp1 + phí ship
        const expected =
          Number(pm.collectionVariables.get('productPrice')) +
          Number(pm.collectionVariables.get('shippingFee'));
        pm.expect(Number(order.totalAmount)).to.eql(expected);
        pm.collectionVariables.set('orderId2', order.id);
      });
