$kind: http-request
method: POST
url: '{{baseUrl}}/orders/{{orderId2}}/payment-callback'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "success": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Callback thanh toán thành công (201)', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().order.paymentStatus).to.eql('PAID');
      });
