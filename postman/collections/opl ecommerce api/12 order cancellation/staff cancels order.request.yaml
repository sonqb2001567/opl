$kind: http-request
method: POST
url: '{{baseUrl}}/orders/{{orderId3}}/cancel-by-staff'
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{inventoryStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Hết hàng, không thể giao"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Nhân viên kho hủy đơn thành công (201)', () => {
        pm.response.to.have.status(201);
        const order = pm.response.json().order;
        pm.expect(order.status).to.eql('CANCELLED');
        // Đơn COD chưa trả tiền nên vẫn UNPAID
        pm.expect(order.paymentStatus).to.eql('UNPAID');
      });
