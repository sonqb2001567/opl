$kind: http-request
method: POST
url: '{{baseUrl}}/cart/items'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId2}},
      "quantity": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Thêm sản phẩm cho đơn sẽ bị kho hủy (201)', () => {
        pm.response.to.have.status(201);
      });
