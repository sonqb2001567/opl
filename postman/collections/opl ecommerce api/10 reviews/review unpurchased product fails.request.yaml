$kind: http-request
method: POST
url: '{{baseUrl}}/reviews'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId3}},
      "rating": 5,
      "comment": "Chưa mua mà đòi đánh giá"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Chưa mua sản phẩm thì không được đánh giá (400)', () => {
        pm.response.to.have.status(400);
      });
