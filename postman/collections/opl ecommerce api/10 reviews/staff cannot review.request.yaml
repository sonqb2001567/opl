$kind: http-request
method: POST
url: '{{baseUrl}}/reviews'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{productStaffToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": {{productId}},
      "rating": 5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Nhân viên không được đánh giá sản phẩm (403)', () => {
        pm.response.to.have.status(403);
      });
